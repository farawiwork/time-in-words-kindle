      font-weight: 400;
      font-style: normal;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
    }

    body {
      overflow: hidden;
      font-family: KindleHebrew, Arial, sans-serif;
      font-weight: 400;
    }

    #digital {
      position: absolute;
      top: 14px;
      left: 18px;
      direction: ltr;
      color: #777;
      font: normal 18px Arial, sans-serif;
    }

    #clock {
      position: absolute;
      top: 54px;
      right: 4%;
      bottom: 330px;
      left: 4%;
      display: table;
      width: 92%;
      height: auto;
      text-align: center;
    }

    #clock-inner {
      display: table-cell;
      vertical-align: middle;
    }

    #hour-line, #minute-line {
      line-height: 1.5;
      font-weight: 400;
    }

    #minute-line:empty {
      display: none;
    }

    #day-part {
      margin-top: 18px;
      font-size: 55%;
      line-height: 1.4;
      font-weight: 400;
    }

    #settings {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      padding: 10px 12px 12px;
      border-top: 2px solid #222;
      background: #fff;
      direction: rtl;
    }

    .control {
      display: block;
      width: 100%;
      min-height: 60px;
      margin: 0 0 8px;
      padding: 8px 14px;
      border: 2px solid #222;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-family: KindleHebrew, Arial, sans-serif;
      font-size: 24px;
      font-weight: 400;
      text-align: center;
      direction: rtl;
      box-sizing: border-box;
    }

    button.control {
      margin-bottom: 0;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    button.control.active {
      color: #fff;
      background: #222;
    }

    @media (min-width: 850px) {
      #clock { bottom: 100px; }
      #settings { direction: rtl; white-space: nowrap; }
      .control {
        display: inline-block;
        width: 24%;
        margin: 0 0.5%;
        vertical-align: middle;
      }
    }
  </style>
</head>
<body>
  <div id="digital">--:--</div>

  <main id="clock" aria-live="polite">
    <div id="clock-inner">
      <div id="hour-line">טוֹעֵן…</div>
      <div id="minute-line"></div>
      <div id="day-part"></div>
    </div>
  </main>

  <div id="settings">
    <button id="font-button" class="control" type="button">גופן: סריף קלאסי</button>
    <button id="size-button" class="control" type="button">גודל: בינוני</button>
    <button id="day-toggle" class="control active" type="button" aria-pressed="true">זמן ביום: מוצג</button>
    <button id="fullscreen-button" class="control" type="button">מסך מלא</button>
  </div>

  <script>
  (function () {
    "use strict";

    var hours = [
      "שְׁתֵּים עֶשְׂרֵה", "אַחַת", "שְׁתַּיִם", "שָׁלוֹשׁ",
      "אַרְבַּע", "חָמֵשׁ", "שֵׁשׁ", "שֶׁבַע",
      "שְׁמוֹנֶה", "תֵּשַׁע", "עֶשֶׂר", "אַחַת עֶשְׂרֵה"
    ];

    var small = [
      "", "אַחַת", "שְׁתַּיִם", "שָׁלוֹשׁ", "אַרְבַּע",
      "חָמֵשׁ", "שֵׁשׁ", "שֶׁבַע", "שְׁמוֹנֶה", "תֵּשַׁע",
      "עֶשֶׂר", "אַחַת עֶשְׂרֵה", "שְׁתֵּים עֶשְׂרֵה",
      "שְׁלוֹשׁ עֶשְׂרֵה", "אַרְבַּע עֶשְׂרֵה", "חֲמֵשׁ עֶשְׂרֵה",
      "שֵׁשׁ עֶשְׂרֵה", "שְׁבַע עֶשְׂרֵה", "שְׁמוֹנֶה עֶשְׂרֵה",
      "תְּשַׁע עֶשְׂרֵה"
    ];

    var tens = ["", "", "עֶשְׂרִים", "שְׁלוֹשִׁים", "אַרְבָּעִים", "חֲמִשִּׁים"];
    var showDayPart = true;

    function lastSunday(year, month) {
      var last = new Date(Date.UTC(year, month + 1, 0));
      return last.getUTCDate() - last.getUTCDay();
    }

    function israelDate() {
      var now = new Date();
      var year = now.getUTCFullYear();
      var marchSunday = lastSunday(year, 2);
      var octoberSunday = lastSunday(year, 9);
      var dstStart = Date.UTC(year, 2, marchSunday - 2, 0, 0, 0);
      var dstEnd = Date.UTC(year, 9, octoberSunday - 1, 23, 0, 0);
      var offset = (now.getTime() >= dstStart && now.getTime() < dstEnd) ? 3 : 2;
      return new Date(now.getTime() + offset * 60 * 60 * 1000);
    }

    function numberToWords(number) {
      var remainder;
      if (number < 20) { return small[number]; }
      remainder = number % 10;
      if (remainder === 0) { return tens[Math.floor(number / 10)]; }
      return tens[Math.floor(number / 10)] + " וְ" + small[remainder];
    }

    function minuteWords(minute) {
      var words;
      if (minute === 0) { return ""; }
      if (minute === 1) { return "וְדַקָּה אַחַת"; }
      if (minute === 2) { return "וּשְׁתֵּי דַקּוֹת"; }
      words = numberToWords(minute);
      if (words.indexOf("שְׁ") === 0) {
        return "וּ" + words + " דַּקּוֹת";
      }
      return "וְ" + words + " דַּקּוֹת";
    }

    function dayPart(hour) {
      if (hour >= 5 && hour < 12) { return "בַּבֹּקֶר"; }
      if (hour >= 12 && hour < 17) { return "בַּצָּהֳרַיִם"; }
      if (hour >= 17 && hour < 21) { return "בָּעֶרֶב"; }
      return "בַּלַּיְלָה";
    }

    function twoDigits(number) {
      return number < 10 ? "0" + number : String(number);
    }

    function updateClock() {
      var date = israelDate();
      var hour24 = date.getUTCHours();
      var minute = date.getUTCMinutes();
      var hour12 = hour24 % 12;
      document.getElementById("digital").innerHTML = twoDigits(hour24) + ":" + twoDigits(minute);
      document.getElementById("hour-line").innerHTML = "הַשָּׁעָה " + hours[hour12];
      document.getElementById("minute-line").innerHTML = minuteWords(minute);
      document.getElementById("day-part").innerHTML = showDayPart ? dayPart(hour24) : "";
    }

    function safeGet(key, fallback) {
      try {
        return window.localStorage.getItem(key) || fallback;
      } catch (error) {
        return fallback;
      }
    }

    function safeSet(key, value) {
      try { window.localStorage.setItem(key, value); } catch (error) {}
    }

    function nextValue(values, current) {
      var index;
      for (index = 0; index < values.length; index += 1) {
        if (values[index] === current) {
          return values[(index + 1) % values.length];
        }
      }
      return values[0];
    }

    function applyFont(value) {
      var family = "KindleHebrew, Arial, sans-serif";
      if (value === "sans") { family = "Arial, Helvetica, sans-serif"; }
      if (value === "serif") { family = "Georgia, Times New Roman, serif"; }
      document.getElementById("clock-inner").style.fontFamily = family;
      document.getElementById("font-button").innerHTML = "גופן: " +
        (value === "sans" ? "Kindle נקי" : (value === "serif" ? "Times" : "סריף קלאסי"));
      safeSet("clockFontV5", value);
    }

    function enterClockMode() {
      var root = document.documentElement;
      var request = root.requestFullscreen || root.webkitRequestFullscreen || root.mozRequestFullScreen;
      document.getElementById("settings").style.display = "none";
      document.getElementById("digital").style.display = "none";
      document.getElementById("clock").style.bottom = "0";
      document.getElementById("clock").onclick = leaveClockMode;
      if (request) {
        try { request.call(root); } catch (error) {}
      }
    }

    function leaveClockMode() {
      var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
      document.getElementById("settings").style.display = "block";
      document.getElementById("digital").style.display = "block";
      document.getElementById("clock").style.bottom = "";
      document.getElementById("clock").onclick = null;
      if (exit) {
        try { exit.call(document); } catch (error) {}
      }
    }

    function applySize(value) {
      document.getElementById("clock-inner").style.fontSize = value + "px";
      document.getElementById("size-button").innerHTML = "גודל: " +
        (value === "38" ? "קטן" : (value === "46" ? "בינוני" : (value === "54" ? "גדול" : "גדול מאוד")));
      safeSet("clockSize", value);
    }

    function applyDayButton() {
      var button = document.getElementById("day-toggle");
      button.innerHTML = showDayPart ? "זמן ביום: מוצג" : "זמן ביום: מוסתר";
      button.className = showDayPart ? "control active" : "control";
      button.setAttribute("aria-pressed", showDayPart ? "true" : "false");
      safeSet("clockDayPart", showDayPart ? "yes" : "no");
      updateClock();
    }

    function start() {
      var savedFont = safeGet("clockFontV5", "embedded");
      var savedSize = safeGet("clockSize", "46");
      var fonts = ["embedded", "sans", "serif"];
      var sizes = ["38", "46", "54", "62"];
      showDayPart = safeGet("clockDayPart", "yes") !== "no";

      applyFont(savedFont);
      applySize(savedSize);
      applyDayButton();

      document.getElementById("font-button").onclick = function () {
        var current = safeGet("clockFontV5", "embedded");
        applyFont(nextValue(fonts, current));
      };
      document.getElementById("size-button").onclick = function () {
        var current = safeGet("clockSize", "46");
        applySize(nextValue(sizes, current));
      };
      document.getElementById("day-toggle").onclick = function () {
        showDayPart = !showDayPart;
        applyDayButton();
      };
      document.getElementById("fullscreen-button").onclick = enterClockMode;

      updateClock();
      window.setInterval(updateClock, 15000);
    }

    if (window.addEventListener) {
      window.addEventListener("load", start, false);
    } else if (window.attachEvent) {
      window.attachEvent("onload", start);
    } else {
      window.onload = start;
    }
  }());
  </script>
</body>
</html>
