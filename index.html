<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>השעה במילים</title>

  <style>
    /*
      Kindle-friendly version:
      - no external libraries
      - no remote fonts
      - only locally available fonts + Kindle/browser fallbacks
    */
    @font-face {
      font-family: "FrankRuhlLocal";
      src: local("Frank Ruhl Libre"), local("Frank Ruhl"), local("FrankRuehl");
    }

    @font-face {
      font-family: "DavidLocal";
      src: local("David Libre"), local("David");
    }

    @font-face {
      font-family: "NotoHebrewLocal";
      src: local("Noto Serif Hebrew"), local("Noto Sans Hebrew"), local("Noto Hebrew");
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #000000;
    }

    body {
      font-family: FrankRuhlLocal, NotoHebrewLocal, DavidLocal, serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    #page {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100%;
      background: #ffffff;
    }

    #digitalClock {
      position: absolute;
      top: 18px;
      left: 18px;
      direction: ltr;
      unicode-bidi: embed;
      font-family: monospace;
      font-size: 15px;
      font-weight: normal;
      color: #d4d7da;
    }

    #clockArea {
      position: absolute;
      top: 47%;
      left: 50%;
      width: 90%;
      text-align: center;
      -webkit-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    #timeWords {
      font-size: 58px;
      line-height: 1.5;
      font-weight: 700;
      text-align: center;
      direction: rtl;
    }

    #dayPart {
      margin-top: 10px;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 400;
      text-align: center;
      direction: rtl;
    }

    #controls {
      position: absolute;
      left: 2%;
      right: 2%;
      bottom: 16px;
      display: table;
      width: 96%;
      table-layout: fixed;
      direction: rtl;
      border-collapse: separate;
      border-spacing: 8px 0;
    }

    .controlCell {
      display: table-cell;
      width: 33.33%;
      vertical-align: middle;
    }

    select, button {
      display: block;
      width: 100%;
      height: 50px;
      box-sizing: border-box;
      border: 1px solid #b7b7b7;
      border-radius: 7px;
      background: #ffffff;
      color: #000000;
      font-family: inherit;
      font-size: 18px;
      text-align: center;
      padding: 4px 6px;
    }

    button {
      cursor: pointer;
    }

    button.active {
      background: #3b4658;
      color: #ffffff;
      border-color: #3b4658;
    }

    /* Smaller screens / Paperwhite portrait */
    @media screen and (max-width: 700px) {
      #timeWords { font-size: 46px; }
      #dayPart { font-size: 24px; }
      select, button { font-size: 16px; height: 46px; }
    }

    @media screen and (max-width: 500px) {
      #timeWords { font-size: 38px; }
      #dayPart { font-size: 21px; }
      select, button { font-size: 15px; height: 44px; }
    }
  </style>
</head>

<body>
  <div id="page">
    <div id="digitalClock">--:--</div>

    <div id="clockArea">
      <div id="timeWords">טוען...</div>
      <div id="dayPart"></div>
    </div>

    <div id="controls">
      <div class="controlCell">
        <select id="fontSelect" aria-label="בחירת גופן">
          <option value="frank">Frank Ruhl</option>
          <option value="david">David</option>
          <option value="noto">Noto Hebrew</option>
          <option value="serif">Kindle Serif</option>
          <option value="sans">Kindle Sans</option>
        </select>
      </div>

      <div class="controlCell">
        <select id="sizeSelect" aria-label="בחירת גודל">
          <option value="40">קטן</option>
          <option value="50">בינוני</option>
          <option value="58" selected>גדול</option>
          <option value="68">גדול מאוד</option>
        </select>
      </div>

      <div class="controlCell">
        <button id="dayPartButton" type="button">זמן יום</button>
      </div>
    </div>
  </div>

  <script type="text/javascript">
  (function () {
    "use strict";

    function byId(id) {
      return document.getElementById(id);
    }

    function storageGet(key, fallback) {
      try {
        var value = window.localStorage.getItem(key);
        return value === null ? fallback : value;
      } catch (e) {
        return fallback;
      }
    }

    function storageSet(key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (e) {}
    }

    var HOURS = {
      1: "אַחַת",
      2: "שְׁתַּיִם",
      3: "שָׁלֹשׁ",
      4: "אַרְבַּע",
      5: "חָמֵשׁ",
      6: "שֵׁשׁ",
      7: "שֶׁבַע",
      8: "שְׁמוֹנֶה",
      9: "תֵּשַׁע",
      10: "עֶשֶׂר",
      11: "אַחַת עֶשְׂרֵה",
      12: "שְׁתֵּים עֶשְׂרֵה"
    };

    var MINUTE_UNITS_F = {
      1: "אַחַת",
      2: "שְׁתַּיִם",
      3: "שָׁלֹשׁ",
      4: "אַרְבַּע",
      5: "חָמֵשׁ",
      6: "שֵׁשׁ",
      7: "שֶׁבַע",
      8: "שְׁמוֹנֶה",
      9: "תֵּשַׁע"
    };

    var MINUTE_UNITS_M = {
      3: "שָׁלֹשׁ",
      4: "אַרְבַּע",
      5: "חָמֵשׁ",
      6: "שֵׁשׁ",
      7: "שֶׁבַע",
      8: "שְׁמוֹנֶה",
      9: "תֵּשַׁע",
      10: "עֶשֶׂר"
    };

    var TENS = {
      20: "עֶשְׂרִים",
      30: "שְׁלֹשִׁים",
      40: "אַרְבָּעִים",
      50: "חֲמִשִּׁים"
    };

    function hour12(hour24) {
      var h = hour24 % 12;
      return h === 0 ? 12 : h;
    }

    function minutesToWords(minute) {
      var tens, units;

      if (minute === 0) {
        return "";
      }

      if (minute === 1) {
        return "דַּקָּה אַחַת";
      }

      if (minute === 2) {
        return "שְׁתֵּי דַּקּוֹת";
      }

      if (minute >= 3 && minute <= 10) {
        return MINUTE_UNITS_M[minute] + " דַּקּוֹת";
      }

      if (minute === 11) {
        return "אַחַת עֶשְׂרֵה דַּקּוֹת";
      }

      if (minute === 12) {
        return "שְׁתֵּים עֶשְׂרֵה דַּקּוֹת";
      }

      if (minute >= 13 && minute <= 19) {
        units = minute - 10;
        return MINUTE_UNITS_F[units] + " עֶשְׂרֵה דַּקּוֹת";
      }

      tens = Math.floor(minute / 10) * 10;
      units = minute % 10;

      if (units === 0) {
        return TENS[tens] + " דַּקּוֹת";
      }

      return TENS[tens] + " וְ" + MINUTE_UNITS_F[units] + " דַּקּוֹת";
    }

    function timeToWords(hour24, minute) {
      var result = "הַשָּׁעָה " + HOURS[hour12(hour24)];

      if (minute > 0) {
        result += "<br>וְ" + minutesToWords(minute);
      }

      return result;
    }

    function getDayPart(hour24) {
      if (hour24 >= 5 && hour24 < 12) {
        return "בַּבֹּקֶר";
      }

      if (hour24 >= 12 && hour24 < 17) {
        return "בַּצָּהֳרַיִם";
      }

      if (hour24 >= 17 && hour24 < 21) {
        return "בָּעֶרֶב";
      }

      return "בַּלַּיְלָה";
    }

    var FONT_MAP = {
      frank: 'FrankRuhlLocal, NotoHebrewLocal, DavidLocal, serif',
      david: 'DavidLocal, FrankRuhlLocal, NotoHebrewLocal, serif',
      noto: 'NotoHebrewLocal, FrankRuhlLocal, DavidLocal, serif',
      serif: 'serif',
      sans: 'sans-serif'
    };

    var timeWords = byId("timeWords");
    var dayPart = byId("dayPart");
    var digitalClock = byId("digitalClock");
    var fontSelect = byId("fontSelect");
    var sizeSelect = byId("sizeSelect");
    var dayPartButton = byId("dayPartButton");

    var showDayPart = storageGet("showDayPart", "0") === "1";
    var savedFont = storageGet("font", "frank");
    var savedSize = storageGet("size", "58");

    fontSelect.value = savedFont;
    sizeSelect.value = savedSize;

    function applySettings() {
      var fontKey = fontSelect.value;
      var size = parseInt(sizeSelect.value, 10);

      if (!FONT_MAP[fontKey]) {
        fontKey = "frank";
      }

      document.body.style.fontFamily = FONT_MAP[fontKey];
      timeWords.style.fontSize = size + "px";
      dayPart.style.fontSize = Math.round(size * 0.48) + "px";

      if (showDayPart) {
        dayPart.style.display = "block";
        dayPartButton.className = "active";
      } else {
        dayPart.style.display = "none";
        dayPartButton.className = "";
      }
    }

    function render() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var minuteText = m < 10 ? "0" + m : "" + m;

      digitalClock.innerHTML = h + ":" + minuteText;
      timeWords.innerHTML = timeToWords(h, m);
      dayPart.innerHTML = getDayPart(h);
    }

    fontSelect.onchange = function () {
      storageSet("font", fontSelect.value);
      applySettings();
    };

    sizeSelect.onchange = function () {
      storageSet("size", sizeSelect.value);
      applySettings();
    };

    dayPartButton.onclick = function () {
      showDayPart = !showDayPart;
      storageSet("showDayPart", showDayPart ? "1" : "0");
      applySettings();
      render();
    };

    applySettings();
    render();

    /* Refresh often enough to catch the next minute. */
    window.setInterval(render, 10000);
  }());
  </script>
</body>
</html>
